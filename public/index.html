<!doctype html>
<html lang="en">
<head>

<meta name="theme-color" content="#b3174f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="css/style.css">
